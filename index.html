<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./images/TheFavicon.png">
  <link rel="stylesheet" href="./css/main.css">
  <title>Arisan</title>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="timer">
      0:00
    </div>
    <div 
      id="mainMenu" 
      class="ui-panel"
    >
      <h1>
        Arisan
      </h1>
      <button id="playBtn">
        Play
      </button>
      <div style="margin-top: 20px; font-size: 12px">
        <div>WASD - Move</div>
        <div>ESC - Pause</div>
      </div>
    </div>
    <div
      id="pauseMenu"
      class="ui-panel"
    >
      <h2>
        Pause
      </h2>
      <button id="resumeBtn">
        Resume
      </button>
      <button id="quitBtn">
        Quit to Menu
      </button>
    </div>
    <div 
      id="loadingScreen" 
      class="ui-panel active"
    >
      <h2>
        Loading...
      </h2>
      <p>
        Arisan is starting up
      </p>
    </div>
  </div>
  <script 
    type="module"
    src="./js/main.js"
  >
  </script>
</body>
</html>
